name: Build Windows and Linux Desktop Apps

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri executable (No bundle)
        run: npx --yes @tauri-apps/cli build --no-bundle

      - name: Package Windows executable
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/Andragon.exe" -DestinationPath "Andragon-windows.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andragon-windows
          path: Andragon-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri executable (No bundle)
        run: npx --yes @tauri-apps/cli build --no-bundle

      - name: Package Linux executable
        run: |
          mkdir -p dist_linux
          cp src-tauri/target/release/Andragon dist_linux/Andragon
          chmod +x dist_linux/Andragon
          cd dist_linux
          zip -r ../Andragon-linux.zip Andragon
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andragon-linux
          path: Andragon-linux.zip
          if-no-files-found: error
