[package]
name = "Andragon"
version = "0.1.0"
description = "A shader visual editor"
authors = ["D7aniel"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["full"] }
rosc = "0.11.4"
tokio-tungstenite = { version = "0.29.0", optional = true }
futures-util = { version = "0.3.33", optional = true }
libloading = { version = "0.8.9", optional = true }

[features]
default = []
ndi = ["dep:tokio-tungstenite", "dep:futures-util", "dep:libloading"]

